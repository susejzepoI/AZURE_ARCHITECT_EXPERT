#JLopez-20251013: Yaml files documentation: https://learnxinyminutes.com/yaml/
# This is a basic workflow to help you get started with Actions
name: simple-ci-linux

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "current" branch
  push:
    branches: [ "current" ]
  pull_request:
    branches: [ "current" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    #JLopez-20251020: This must be windows-latest to run PowerShell scripts.
    runs-on: windows-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      #JLopez-20251020: 
      #                 https://github.com/marketplace/actions/azure-login
      #                 Before you use Azure Login Action with OIDC, you need to configure a 
      #                 federated identity credential on a service principal or a managed identity.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run powershell deployment scripts.
        shell: pwsh
        run: |
          ./00002-PROJECT-AZURE-POLCY-REMEDIATION-TASKS/main.ps1 `
            -ProjectTagName "Environment" `
            -ProjectTagValue "QA"

