name: 00001-deploy-hello-world-azure-container-instance

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "current" branch
  push:
    branches: [ "current" ]
    paths:
      - '00001-PROJECT-HELLO-WORLD-AZURE-CONTAINER-INSTANCE/**'
  pull_request:
    branches: [ "current" ]
    paths:
      - '00001-PROJECT-HELLO-WORLD-AZURE-CONTAINER-INSTANCE/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  #JLopez-20251028: Grant OIDC permissions
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run powershell deployment scripts.
        shell: pwsh
        run: |
          cd .\00001-PROJECT-HELLO-WORLD-AZURE-CONTAINER-INSTANCE\
          .\main.ps1 `
            -SubscriptionName "Suscripción de Plataformas de MSDN" `
            -ImageName "hello_api:latest" `
            -Environment "DEV"